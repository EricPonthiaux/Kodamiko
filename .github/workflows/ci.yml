# Builds, tests and packages the editor on Linux, Windows and macOS.
# The packages (AppImage, Windows zip, dmg) are published as artifacts.
# Only main is built: the other branches are work in progress.
name: CI

on:
  push:
    branches: [main]
    # A push that only changes the site or the documentation would rebuild
    # the same packages for half an hour.
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/pages.yml"

env:
  # aqtinstall 3.3.0, which install-qt-action uses, does not find Qt 6.11+
  # for Windows.
  QT_VERSION: "6.10.3"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # qtserialport: Qt Positioning's NMEA plugin links against it, and
          # the AppImage step deploys every plugin of a module it bundles.
          # qt5compat: Scintilla's Qt widget uses QTextCodec.
          modules: qtwebengine qtwebchannel qtpositioning qtserialport qt5compat
          cache: true

      - name: Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libfuse2 libgraphviz-dev pkg-config

      - name: macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja graphviz pkg-config

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The sources and the subbuilds go together: a subbuild's stamps alone
      # make FetchContent skip the clone and update an empty source folder.
      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: deps-v2-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/GraphvizWindows.cmake') }}

      # LTO is off in the CI for now. KDK_NATIVE (-march=native), on in the
      # default preset, stays on for macOS only: its runner is an M1, the
      # first Apple Silicon processor, whose code every later one runs. On
      # Linux and Windows, the packages would run on the runner's processor
      # only, and could stop with an illegal instruction on an older one.
      - name: Configure
        run: cmake --preset default -DKDK_LTO=OFF -DKDK_NATIVE=${{ runner.os == 'macOS' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build --preset default

      - name: Test
        run: ctest --preset default

      # The report of every test, failed or not, for the cases where ctest's
      # output lacks it.
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: build/test-logs/
          if-no-files-found: ignore

      - name: Failed test reports
        if: failure()
        shell: bash
        run: |
          for log in build/test-logs/*.txt; do
            # A crashed test never writes its "Finished testing" line.
            if ! grep -q -E '^(FAIL!|QFATAL)' "$log" && grep -q '^\*\*\*\*\*\*\*\*\* Finished testing' "$log"; then
              continue
            fi
            echo "::group::$(basename "$log" .txt)"
            cat "$log"
            echo "::endgroup::"
          done

      - name: Linux package (AppImage)
        if: runner.os == 'Linux'
        run: |
          cmake --install build --component kodamiko --prefix AppDir/usr
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/kodamiko.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/kodamiko.svg \
            --executable AppDir/usr/bin/kodamiko-hook \
            --executable AppDir/usr/bin/kodamiko-mcp \
            --executable AppDir/usr/bin/kodamiko-askpass

      - name: Windows package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build --component kodamiko --prefix Kodamiko
          windeployqt --release --no-translations Kodamiko/bin/kodamiko.exe
          Compress-Archive -Path Kodamiko/* -DestinationPath Kodamiko-windows.zip

      - name: macOS package (dmg)
        if: runner.os == 'macOS'
        run: |
          cmake --install build --component kodamiko --prefix dist
          macdeployqt dist/Kodamiko.app -executable=dist/Kodamiko.app/Contents/MacOS/kodamiko-hook \
            -executable=dist/Kodamiko.app/Contents/MacOS/kodamiko-mcp \
            -executable=dist/Kodamiko.app/Contents/MacOS/kodamiko-askpass
          # macdeployqt rewrites the binaries and leaves the bundle unsealed:
          # macOS calls an unsealed download damaged and refuses to open it.
          # An ad hoc signature seals it; without a Developer ID, Gatekeeper
          # still asks to confirm the first launch.
          codesign --force --deep --sign - dist/Kodamiko.app
          codesign --verify --deep --strict dist/Kodamiko.app
          hdiutil create -volname Kodamiko -srcfolder dist/Kodamiko.app -format UDZO dist/Kodamiko.dmg

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: kodamiko-${{ matrix.os }}
          path: |
            *.AppImage
            Kodamiko-windows.zip
            dist/*.dmg
          if-no-files-found: ignore
