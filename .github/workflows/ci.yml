# Builds, tests and packages the editor on Linux, Windows and macOS.
# The packages (AppImage, Windows zip, dmg) are published as artifacts.
name: CI

on:
  push:
  pull_request:

env:
  QT_VERSION: "6.8.3"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libfuse2 libgraphviz-dev pkg-config

      - name: macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja graphviz pkg-config

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps/*-subbuild
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default

      - name: Test
        run: ctest --preset default

      - name: Linux package (AppImage)
        if: runner.os == 'Linux'
        run: |
          cmake --install build --component duet --prefix AppDir/usr
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/duet.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/duet.svg \
            --executable AppDir/usr/bin/duet-hook \
            --executable AppDir/usr/bin/duet-mcp \
            --executable AppDir/usr/bin/duet-askpass

      - name: Windows package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build --component duet --prefix Duet
          windeployqt --release --no-translations Duet/bin/duet.exe
          Compress-Archive -Path Duet/* -DestinationPath Duet-windows.zip

      - name: macOS package (dmg)
        if: runner.os == 'macOS'
        run: |
          cmake --install build --component duet --prefix dist
          macdeployqt dist/Duet.app -dmg -executable=dist/Duet.app/Contents/MacOS/duet-hook \
            -executable=dist/Duet.app/Contents/MacOS/duet-mcp \
            -executable=dist/Duet.app/Contents/MacOS/duet-askpass

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: duet-${{ matrix.os }}
          path: |
            *.AppImage
            Duet-windows.zip
            dist/*.dmg
          if-no-files-found: ignore
